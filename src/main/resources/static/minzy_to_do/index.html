<!DOCTYPE html>
<html lang="ko"> 
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device=width, initial-scale=1.0">
	<title>토이 1호:첫 웹페이지</title>
	<link rel="stylesheet" href="css/style.css">
</head>

<body>
	<section>
		<h1>산의 첫 웹페이지</h1>
		<p>웹 개발을 시작했습니다</p>
		<!-- <b>진한 글자 -->
		<p>오늘은 <b>좋은</b> 날입니다.</p>
	</section>
	<section>
		<h2>오늘 할 일</h2>
		<!-- 리스트 만들기 -->
		<ul>
			<li>책 읽기</li>
			<li>산책하기</li>
			<li>밥 먹기</li>
		</ul>
		<!-- 입력창과 버튼 만들기 -->
		<label for="nickname">별명</label>
		<input
			id="nickname"
			type="text"
			placeholder="별명을 입력하세요" >
		<button type="button" id="helloButton">
			인사하기</button>
	</section>
	<!-- section 대신 div 사용 -->
	<div class="card">
		<h2>🍮🍮할 일🍮🍮</h2>
		<p>오늘도 열심히 공부했어요</p>
		
		<div>
			<input type="text" id="taskInput"
				placeholder="할 일을 입력하세요">
				
			<button id="addButton">추가하기</button>
		</div>
		
		<!-- 입력상자에서 입력한 할 일 추가 -->
		<ul id="taskList">
		</ul>
		
	</div>
	<hr>
	<div id="result">행운을 뽑아봅시다.	</div>
	
	<button onclick="drawFortune()">행운뽑기</button>
	<button onclick="saveFortune()">행운 저장</button>
	<button onclick="loadFortune()">저장된 행운 불러오기</button>
	<button onclick="deleteFortune()">저장 삭제</button>
	
	<script src="js/app.js"></script>
	
	<!-- 
		1. css : 화면을 꾸미는 아이. 제일 먼저 불러옴
		2. html : 구조를 만드는 아이. css파일 다음에 와야함.	
		3. js : html 구조가 만들어져야 작동
			따라서 </body> 태그 바로 위에 위치하는게 좋다
	-->
</body>
</html>
