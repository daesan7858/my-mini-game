<!DOCTYPE html>
<html lang="ko"> 
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device=width, initial-scale=1.0">
	<title>토이 1호:첫 웹페이지</title>
	<link rel="stylesheet" href="css/style.css">
</head>

<body>
	<section>
		<h1>산의 첫 웹페이지</h1>
		<p>웹 개발을 시작했습니다</p>
		<!-- <b>진한 글자 -->
		<p>오늘은 <b>좋은</b> 날입니다.</p>
	</section>
	<section>
		<h2>오늘 할 일</h2>
		<!-- 리스트 만들기 -->
		<ul>
			<li>책 읽기</li>
			<li>산책하기</li>
			<li>밥 먹기</li>
		</ul>
		<!-- 입력창과 버튼 만들기 -->
		<label for="nickname">별명</label>
		<input
			id="nickname"
			type="text"
			placeholder="별명을 입력하세요" >
		<button type="button" id="helloButton">
			인사하기</button>
	</section>
	<!-- section 대신 div 사용 -->
	<div class="card">
		<h2>오늘의 할 일</h2>
		<p>배고파</p>
	</div>

	<!-- 12. 객체와 배열 -->
	<div class="card">
		<button id="button1">첫번째 배열 요소값 출력</button>
		<button id="button2">두번째 배열 요소값 출력</button>
		<button id="button3">세번째 배열 요소값 출력</button>
		<button id="button4">네번째 배열 요소값 출력</button>
		<button id="button5">다섯번째 배열 요소값 출력</button>
	</div>

	<script src="js/app.js"></script>
	
	<!-- 
		1. css : 화면을 꾸미는 아이. 제일 먼저 불러옴
		2. html : 구조를 만드는 아이. css파일 다음에 와야함.	
		3. js : html 구조가 만들어져야 작동
			따라서 </body> 태그 바로 위에 위치하는게 좋다
	-->
</body>
</html>
